# Infrastructure Domain — Process Knowledge
# SOPs and rules for deployment, Docker, nginx, and system operations
#
# ---------------------------------------------------------------------------
# THESE ARE ILLUSTRATIVE EXAMPLES, NOT AN OPERATIONAL RUNBOOK.
#
# The entries below show the SHAPE of a process-knowledge domain file: how to
# express a rule, an SOP with verifiable steps, and an edge case. The specific
# hosts, domains, and commands are placeholders written against a generic
# "Docker behind nginx on a VPS" topology.
#
# Replace them with your own before relying on any of it. Every host is a
# ${PLACEHOLDER} that you are expected to define for your environment; nothing
# here is verified against your infrastructure.
# ---------------------------------------------------------------------------

domain: infrastructure
description: "Infrastructure operations knowledge — Docker, nginx, deployment, monitoring (example content)"
status: example

rules:
  - id: "INFRA-DOCKER-001"
    domain: "infrastructure.docker"
    name: "Container memory limit requirement"
    condition: "deploy_to_production == true AND memory_limit == null"
    action: "set_memory_limit AND log_warning"
    source: "Docker deployment standards"
    effective_date: "2026-01-01"
    verified_by: "bulletproofsoftware-ai"
    verified_date: "2026-04-16"
    status: example
    tags: ["docker", "memory", "limits"]
    priority: 2

  - id: "INFRA-DOCKER-002"
    domain: "infrastructure.docker"
    name: "Docker Compose health check"
    condition: "service_type == 'web' AND healthcheck == null"
    action: "add_healthcheck_to_compose AND configure_restart_policy"
    source: "Docker deployment standards"
    effective_date: "2026-01-01"
    verified_by: "bulletproofsoftware-ai"
    verified_date: "2026-04-16"
    status: example
    tags: ["docker", "healthcheck", "compose"]
    priority: 2

  - id: "INFRA-NGINX-001"
    domain: "infrastructure.nginx"
    name: "SSL certificate renewal check"
    condition: "cert_expiry_days <= 30"
    action: "trigger_certbot_renewal AND verify_renewal"
    source: "SSL management SOP"
    effective_date: "2026-01-01"
    verified_by: "bulletproofsoftware-ai"
    verified_date: "2026-04-16"
    status: example
    tags: ["ssl", "certbot", "renewal"]
    priority: 1

sops:
  # EXAMPLE. ${DEPLOY_HOST} is a placeholder for a host you define — there is
  # no implied SSH alias, and nothing here has been verified against a real
  # deployment. Adapt the steps to your own topology.
  - id: "INFRA-DEPLOY-SOP-001"
    domain: "infrastructure.deployment"
    name: "Deploy a container behind an nginx reverse proxy (example)"
    source: "Illustrative example"
    status: example
    steps:
      - action: "Confirm the deploying host's IP is permitted by the firewall"
        verification: "ssh ${DEPLOY_HOST} 'csf -g ${SOURCE_IP}'"
        note: "Substitute your own firewall tooling; csf is one example."
        critical: true
      - action: "Verify the container binds to loopback, not 0.0.0.0"
        verification: "grep '127.0.0.1' docker-compose.yml"
        note: "The reverse proxy should be the only public listener."
        critical: true
      - action: "Deploy via docker compose"
        verification: "docker compose up -d && docker compose ps"
      - action: "Test through the reverse proxy rather than the container port"
        verification: "curl -s https://${DOMAIN}/health"
        critical: true
      - action: "Confirm your monitoring agent reports the new service"
        verification: "Check your monitoring dashboard for new service events"

  - id: "INFRA-BACKUP-SOP-001"
    domain: "infrastructure.backup"
    name: "Qdrant backup procedure"
    source: "Illustrative example"
    status: example
    steps:
      - action: "Create Qdrant snapshot via API"
        verification: "curl -X POST localhost:6333/snapshots"
        # Add -H 'api-key: ${QDRANT_API_KEY}' if API key auth is enabled
      - action: "Copy snapshot to backup location"
        verification: "ls -la /backups/qdrant/"
      - action: "Verify snapshot integrity"
        verification: "Test restore to temp collection"
      - action: "Clean old snapshots (>7 days)"
        verification: "ls /backups/qdrant/ | wc -l"

decision_trees: []

edge_cases:
  - id: "INFRA-DOCKER-EC-001"
    domain: "infrastructure.docker"
    name: "Docker compose v2 named volumes on remote"
    scenario: "Deploying with named volumes on a remote VPS that already has data"
    standard_behavior: "docker compose up creates volumes if not present"
    exception: "If a volume already exists with data from a previous version, compose will NOT recreate it and the old data persists. 'docker compose down -v' removes the volumes, but that DESTROYS the data they hold — always back up first."
    source: "Illustrative example"
    status: example
