# Session prediction algorithm
session_prediction:
  trigger_after_tasks: 3
  update_interval_tasks: 3
  algorithm: |
    1. Compute average tier score of last 3 tasks
    2. Look up current day/time workload profile
    3. Blend session signal (60% weight) with profile (40% weight)
    4. Produce: predicted tier, predicted agent count, predicted tokens
    5. Assign confidence: min(0.95, 0.5 + 0.15 * task_count)
    # NOTE: Confidence ceiling reached at task_count=3. For better discrimination,
    # consider basing confidence on tier_variance: min(0.95, 0.5 + 0.1*count - 0.1*variance)
  confidence_floor: 0.50
  confidence_ceiling: 0.95

# Profile learning
learning:
  update_frequency: "daily"
  n8n_workflow: "predictive-patterns"
  data_source: "Qdrant trajectory collection"
  lookback_days: 30
  smoothing: "exponential_moving_average"
  alpha: 0.3
