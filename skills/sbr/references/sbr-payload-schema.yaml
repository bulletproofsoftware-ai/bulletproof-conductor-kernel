# SBR Point Payload Schema
#
# Authoritative payload structure for every point stored in the Qdrant `sbr` collection.
# Maintained by the `sbr` skill. The skill talks directly to Qdrant via HTTP — points are
# NOT stored via mcp__claude-memory__memory_store, which does not accept a `collection`
# parameter (verified against claude-memory-mcp/src/index.ts:380-403).
#
# This payload is intentionally self-contained. It does NOT include cross-references to
# KU/KI phrases, project_signature centroids, or agent-card metadata. If those concepts
# evolve in future enhancements, they remain in their own data models. SBR carries only
# what is needed to retrieve "a prompt that worked" and trace it back to its proof.

collection: sbr
vector:
  size: 768                  # nomic-embed-text dimensions (Ollama default)
  distance: Cosine

# Point ID:
# 64-char lowercase hex SHA-256 of:
#   sha256(prompt_text + "|" + agent + "|" + project)
# This makes upsert idempotent — re-ingesting the same (prompt, agent, project)
# triple overwrites the existing point in place.
id_format: sha256_hex_64

# ---------------------------------------------------------------------------
# Payload fields
# ---------------------------------------------------------------------------
# REQUIRED — every SBR point must carry these fields. The ingest script must
# refuse to upsert a point missing any required field.
# ---------------------------------------------------------------------------

required:
  sbr_id:
    type: string
    pattern: "^sbr_[0-9TZ:.\\-]+_gv_[A-Za-z0-9_]+$"
    description: >
      Human-readable identity. Format: `sbr_{iso_timestamp}_{validation_id}`.
      Distinct from the Qdrant point ID (which is the content hash). Used in logs
      and operator-facing tooling.
    example: "sbr_2026-05-11T15:00:00Z_gv_20260511_007"

  agent:
    type: string
    description: >
      Which conductor agent produced the prompt — e.g., conductor-architect,
      conductor-builder, conductor-ciso. Used for agent-scoped retrieval filters.
    example: "conductor-builder"

  project:
    type: string
    description: >
      Project name copied from conductor-state.project_name at ingest time.
      Used for project-scoped retrieval filters.
    example: "my-project"

  prompt_text:
    type: string
    minLength: 1
    description: >
      Full text of the prompt or spec sent to the agent. This is what gets
      embedded. Sanitization MUST have already been applied before this field is
      populated — no secrets, no T2-Confidential or T3-Restricted markers, no
      absolute home/system paths, no email addresses (replaced with [REDACTED]).
      See scripts/ingest-sbr.sh for the deterministic regex filters.

  spec_summary:
    type: string
    minLength: 1
    maxLength: 500
    description: >
      Lean 2–3 line distillation of the prompt's intent. Generated by simple
      heuristics in ingest-sbr.sh (first H1 + first paragraph, truncated). No
      LLM call. Returned in search results so callers can decide whether to
      fetch the full prompt_text.

  outcome_validation_id:
    type: string
    pattern: "^gv_[A-Za-z0-9_]+$"
    description: >
      The gemini_validations[] entry ID that produced the PASS verdict for this
      prompt. Lets the caller trace the example back to its proof in conductor-state.
    example: "gv_20260511_007"

  completion_pct:
    type: integer
    minimum: 80              # ingestion floor — verified by ingest-sbr.sh
    maximum: 100
    description: >
      Gemini's reported completion percentage. SBR ingests only completion_pct >= 80.

  verdict:
    type: string
    const: PASS
    description: >
      The Gemini verdict that qualified this prompt for SBR. Always "PASS" —
      FAIL and PARTIAL are not ingested. Stored explicitly so search filters
      can assert verdict == PASS without inferring it from completion_pct.

  ingested_at:
    type: string
    format: date-time
    description: ISO-8601 timestamp when this point was written to Qdrant.

# ---------------------------------------------------------------------------
# OPTIONAL — these fields are populated when available but not required.
# Their absence does not block ingestion.
# ---------------------------------------------------------------------------

optional:
  tier:
    type: string
    enum: [TRIVIAL, MINOR, STANDARD, MAJOR]
    description: Tier of the workflow this prompt came from. Useful for tier-scoped search.

  domain:
    type: string
    description: >
      Free-form domain tag (e.g., "auth", "billing", "scanning"). Populated when
      the prompt or handoff_history entry carried a domain field. Used in search
      filters for domain-scoped retrieval.

  file_paths_changed:
    type: array
    items:
      type: string
    description: >
      Files the implementation touched, copied from completed_tasks. Stripped of
      absolute path prefixes — only repo-relative paths are stored. Helps the
      caller assess whether a retrieved prompt is in the same area of the codebase.

  related_brd_req:
    type: string
    pattern: "^(REQ|INT)-[A-Z0-9]+$"
    description: BRD-tracker requirement or integration ID this work traced to.

  tags:
    type: array
    items:
      type: string
    description: Free-form operator tags. Defaults to empty array.

  workflow_id:
    type: string
    description: >
      Conductor workflow identifier (initiated_at or similar) so retrievals can
      surface which workflow run an example came from.

# ---------------------------------------------------------------------------
# Fields explicitly NOT in this schema (and why)
# ---------------------------------------------------------------------------
# These were considered and rejected to keep SBR standalone:
#
#   - ku_phrases_present:    Cross-couples SBR to Spec 1 (KU/KI extraction).
#                            KU/KI is an independent output of conductor-retrospective;
#                            SBR must not depend on KU/KI being run.
#
#   - is_centroid:           Cross-couples SBR to Spec 2 (project_signature).
#                            project_signature does not currently cluster examples;
#                            centroid semantics belong to a separate enhancement if
#                            they are ever introduced.
#
#   - process_knowledge_*:   process_knowledge is rule-based and lives in its own
#                            Qdrant collection. SBR retrieves examples, not rules.
#                            No payload field references the process_knowledge model.
#
#   - signed_card_hash:      Agent identity / authority lives in agent cards (Spec 4).
#                            SBR is an internal corpus, not part of the external
#                            agent-invocation surface.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Example payload (full)
# ---------------------------------------------------------------------------
example:
  sbr_id: "sbr_2026-05-11T15:00:00Z_gv_20260511_007"
  agent: "conductor-builder"
  project: "my-project"
  prompt_text: |
    Implement REST endpoint POST /webhooks/billing with HMAC-SHA256 signature
    verification per the Stripe webhook protocol. Reject requests where the
    signature does not match or the timestamp is older than 5 minutes.
    Idempotency on event ID. Response 200 on success, 400 on invalid signature,
    409 on duplicate event.
  spec_summary: |
    Add HMAC-verified billing webhook endpoint. Required acceptance: signature
    check, 5-minute timestamp tolerance, idempotency on event ID.
  outcome_validation_id: "gv_20260511_007"
  completion_pct: 95
  verdict: "PASS"
  ingested_at: "2026-05-11T15:00:00Z"
  tier: "STANDARD"
  domain: "billing"
  file_paths_changed:
    - "src/webhooks/billing.ts"
    - "tests/webhooks/billing.test.ts"
  related_brd_req: "REQ-027"
  tags: ["webhooks", "stripe", "hmac"]
  workflow_id: "2026-05-11T14:00:00Z"
